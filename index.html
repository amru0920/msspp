<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MSSPP Bola Baling 2026 — Keputusan</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="MSSPP Bola Baling 2026">
<meta property="og:title" content="Kejohanan Bola Baling MSSPP 2026">
<meta property="og:description" content="Keputusan rasmi, kedudukan kumpulan & bracket — Peringkat Negeri Pulau Pinang.">
<meta property="og:url" content="https://msspp.pages.dev/">
<meta property="og:image" content="https://msspp.pages.dev/og.png?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://msspp.pages.dev/og.png?v=1">
<link rel="icon" href="msspp-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2C5CA8;--blueDark:#1B4079;--blueSoft:#E8EEF8;
    --yellow:#F2DE1B;--ink:#152238;--muted:#6B7A94;
    --bg:#F2F5FA;--card:#fff;--line:#D9E1EE;--win:#1B7A4A;--gold:#B98A1E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  /* ── HERO ── */
  .hero{background:linear-gradient(160deg,var(--blueDark) 0%,var(--blue) 100%);color:#fff;position:relative;padding:22px 16px 36px}
  .hero-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px}
  .hero img{width:56px;height:56px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.3))}
  .eyebrow{font-family:Archivo;font-weight:700;font-size:11px;letter-spacing:.16em;color:var(--yellow);text-transform:uppercase}
  h1{font-family:Archivo;font-weight:800;font-size:22px;line-height:1.15;margin-top:3px}
  .wave{position:absolute;left:0;right:0;bottom:-1px;line-height:0}
  .wave svg{display:block;width:100%;height:22px}

  .wrap{max-width:860px;margin:0 auto;padding:0 16px 70px}

  /* ── TABS ── */
  .tabs,.views{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar,.views::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;font-family:Archivo;font-weight:700;font-size:13px;
       color:var(--blueDark);background:var(--card);border:1px solid var(--line);
       padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
  .tab.on{background:var(--yellow);border-color:var(--yellow)}
  .views .tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}

  .section{font-family:Archivo;font-weight:700;font-size:11px;letter-spacing:.14em;
           color:var(--muted);text-transform:uppercase;margin:20px 0 10px}

  /* ── RESULT CARDS ── */
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:12px;
         padding:4px 14px;margin-bottom:10px;border-left:4px solid var(--blue)}
  .rmeta{font-size:11px;color:var(--muted);padding:10px 0 4px}
  .rrow{display:grid;grid-template-columns:1fr 44px;align-items:center;padding:7px 0;font-size:14px}
  .rrow.first{border-bottom:1px dashed var(--line)}
  .rrow:last-child{padding-bottom:12px}
  .winner .rname{font-weight:700;color:var(--blueDark)}
  .winner .rscore{color:var(--blue)}
  .winner .rname::after{content:" ◂";color:var(--blue);font-size:12px}
  .rscore{font-family:Archivo;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
  .pending{color:var(--muted);font-style:italic}

  /* ── GROUP GRID (Image 1 style) ── */
  .group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:8px}
  .grp-box{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .grp-hdr{background:var(--blue);color:#fff;font-family:Archivo;font-weight:800;
           font-size:13px;padding:9px 14px;letter-spacing:.04em}
  .grp-team{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--blueSoft);font-size:13.5px}
  .grp-team:last-child{border-bottom:none}
  .grp-seed{font-family:Archivo;font-weight:800;font-size:11px;color:var(--muted);width:18px}

  /* ── ROUND-ROBIN MATRIX (Image 2 style) ── */
  .matrix-wrap{overflow-x:auto;margin-bottom:16px}
  .rr-title{font-family:Archivo;font-weight:800;font-size:13px;
            background:var(--blue);color:#fff;display:inline-block;
            padding:5px 14px;border-radius:8px 8px 0 0}
  table.matrix{border-collapse:collapse;min-width:100%}
  table.matrix th,table.matrix td{border:1px solid var(--line);padding:0;text-align:center;font-size:12.5px}
  table.matrix thead th{background:var(--blueSoft);color:var(--blueDark);
                        font-family:Archivo;font-weight:700;font-size:11px;
                        letter-spacing:.04em;padding:8px 10px;white-space:nowrap}
  table.matrix thead th.corner{background:transparent;border:none}
  table.matrix thead th.team-hdr{min-width:80px}
  table.matrix .row-lbl{background:var(--blueSoft);font-family:Archivo;font-weight:700;
                        font-size:12px;color:var(--blueDark);padding:6px 12px;text-align:left;white-space:nowrap}
  table.matrix .self{background:#F0F3F8}
  table.matrix .cell-match{padding:8px 10px;min-width:64px}
  table.matrix .cell-match.won{background:var(--blueSoft)}
  .cell-sc{display:flex;justify-content:center;align-items:center;gap:8px;
           font-family:Archivo;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  .cell-match.won .cell-sc{color:var(--blue)}
  .cell-sc .div{color:var(--muted);font-weight:400;font-size:13px}
  .cell-pt{font-size:11px;color:var(--muted);margin-top:2px}
  .cell-match.won .cell-pt{color:var(--blueDark);font-weight:600}
  /* stats columns */
  table.matrix .stat{padding:8px 10px;font-family:Archivo;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
  table.matrix .stat.pts{color:var(--blueDark);font-size:14px}
  table.matrix .rank-row:nth-child(-n+2) .row-lbl{color:var(--win)}

  /* ── BRACKET ── */
  .bracket{display:flex;gap:0;overflow-x:auto;padding:10px 2px 18px}
  .bcol{display:flex;flex-direction:column;justify-content:space-around;gap:16px;min-width:175px}
  .bcol h4{font-family:Archivo;font-weight:800;font-size:11px;letter-spacing:.12em;
           color:var(--blueDark);text-transform:uppercase;margin:0 0 6px;text-align:center}
  .bjoin{width:24px;flex:0 0 24px;display:flex;flex-direction:column}
  .bjoin .lk{flex:1;position:relative}
  .bjoin .lk::before{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--line)}
  .bjoin .lk.top::after{content:"";position:absolute;right:0;bottom:0;width:100%;height:2px;background:var(--line)}
  .bjoin .lk.bot::after{content:"";position:absolute;right:0;top:0;width:100%;height:2px;background:var(--line)}
  .bjoin .mid{height:2px;background:var(--line);width:100%}
  .bm{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
  .bm:last-child{margin-bottom:0}
  .bm.final-match{border:2px solid var(--yellow);box-shadow:0 2px 12px rgba(242,222,27,.3)}
  .bt{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:13px;gap:6px}
  .bt+.bt{border-top:1px solid var(--line)}
  .bt .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .bt .s{font-family:Archivo;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted);min-width:20px;text-align:right}
  .bt.w{background:var(--blueSoft)}
  .bt.w .n{font-weight:700;color:var(--blueDark)}
  .bt.w .s{color:var(--blue)}
  .tbd{color:var(--muted);font-style:italic}
  .champ{text-align:center;font-family:Archivo;font-weight:800;font-size:13px;color:var(--gold);padding:8px 0 2px}

  .empty{color:var(--muted);font-size:13px;padding:20px 0;text-align:center}
  .hidden{display:none}
  footer{color:var(--muted);font-size:11px;text-align:center;margin-top:28px}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <img src="msspp-logo.png" alt="MSSPP" id="logo" style="cursor:pointer">
    <div>
      <div class="eyebrow">Keputusan Rasmi · Bola Baling</div>
      <h1>MSSPP Peringkat Negeri 2026</h1>
    </div>
  </div>
  <div class="wave"><svg viewBox="0 0 800 22" preserveAspectRatio="none">
    <path d="M0,14 C100,4 200,24 300,14 C400,4 500,24 600,14 C700,4 800,22 800,14 L800,22 L0,22 Z" fill="#F2F5FA"/>
  </svg></div>
</div>

<div class="wrap">
  <!-- Category tabs -->
  <div class="tabs" id="tabs"></div>

  <!-- View tabs -->
  <div class="views">
    <div class="tab on" data-view="groups">Kumpulan</div>
    <div class="tab" data-view="results">Keputusan</div>
    <div class="tab" data-view="matrix">Jadual Mata</div>
    <div class="tab" data-view="bracket">Bracket</div>
  </div>

  <!-- Views -->
  <div id="v-groups"></div>
  <div id="v-results" class="hidden"></div>
  <div id="v-matrix" class="hidden"></div>
  <div id="v-bracket" class="hidden"></div>

  <footer>Majlis Sukan Sekolah Pulau Pinang · Bola Baling 2026</footer>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
import { SUPABASE_URL, SUPABASE_ANON } from "./config.js";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = s => document.querySelector(s);
const ROUND = {qf:"Suku Akhir",sf:"Separuh Akhir",third:"Tempat Ke-3",final:"Akhir"};

let cats=[], cat=null, teams={}, teamList=[], matches=[];

// ── view switching ──
document.querySelectorAll(".views .tab").forEach(el=>el.onclick=()=>{
  document.querySelectorAll(".views .tab").forEach(t=>t.classList.remove("on"));
  el.classList.add("on");
  ["groups","results","matrix","bracket"].forEach(v=>
    $("#v-"+v).classList.toggle("hidden", v!==el.dataset.view));
});

// ── boot ──
async function boot(){
  const { data } = await sb.from("categories").select("*").order("sort_order");
  cats=data||[]; if(cats.length) cat=cats[0].id;
  renderTabs(); if(cat) load();
}
function renderTabs(){
  $("#tabs").innerHTML=cats.map(c=>
    `<div class="tab ${c.id===cat?'on':''}" data-id="${c.id}">${c.name}</div>`).join("");
  $("#tabs").querySelectorAll(".tab").forEach(el=>el.onclick=()=>{cat=+el.dataset.id;renderTabs();load();});
}
async function load(){
  const [{data:tm},{data:mt}]=await Promise.all([
    sb.from("teams").select("*").eq("category_id",cat).order("name"),
    sb.from("matches").select("*").eq("category_id",cat).order("id"),
  ]);
  teamList=tm||[]; teams=Object.fromEntries(teamList.map(t=>[t.id,t])); matches=mt||[];
  renderGroups(); renderResults(); renderMatrix(); renderBracket();
}
const nm=id=>teams[id]?.name||null;

// ════════════════════════════════════════
// 1. GROUP GRID — macam Image 1
// ════════════════════════════════════════
function renderGroups(){
  const grouped={};
  teamList.forEach(t=>{ if(t.group_label)(grouped[t.group_label]||=[]).push(t); });
  const labels=Object.keys(grouped).sort();
  if(!labels.length){ $("#v-groups").innerHTML=`<div class="empty">Pasukan belum ditetapkan kumpulan.</div>`; return; }
  $("#v-groups").innerHTML=`<div class="group-grid">${
    labels.map(g=>`<div class="grp-box">
      <div class="grp-hdr">KUMPULAN ${g}</div>
      ${grouped[g].map((t,i)=>`<div class="grp-team">
        <span class="grp-seed">${g}${i+1}</span>${t.name}
      </div>`).join("")}
    </div>`).join("")
  }</div>`;
}

// ════════════════════════════════════════
// 2. RESULTS — FIFA card style
// ════════════════════════════════════════
function renderResults(){
  const done=matches.filter(m=>m.done);
  const upcoming=matches.filter(m=>!m.done&&m.team_a_id&&m.team_b_id);
  let html="";
  if(done.length) html+=`<div class="section">Selesai</div>`+done.map(rc).join("");
  if(upcoming.length) html+=`<div class="section">Belum Bermain</div>`+upcoming.map(rc).join("");
  $("#v-results").innerHTML=html||`<div class="empty">Belum ada perlawanan.</div>`;
}
function rc(m){
  const label=m.round==='group'?`Kumpulan ${m.group_label||''}`:ROUND[m.round]||m.round;
  const aW=m.done&&m.score_a>m.score_b, bW=m.done&&m.score_b>m.score_a;
  return `<div class="rcard">
    <div class="rmeta">${label}${m.done?'':' · <span class="pending">belum bermain</span>'}</div>
    <div class="rrow first ${aW?'winner':''}"><span class="rname">${nm(m.team_a_id)||'—'}</span><span class="rscore">${m.done?m.score_a:''}</span></div>
    <div class="rrow ${bW?'winner':''}"><span class="rname">${nm(m.team_b_id)||'—'}</span><span class="rscore">${m.done?m.score_b:''}</span></div>
  </div>`;
}

// ════════════════════════════════════════
// 3. ROUND-ROBIN MATRIX — macam Image 2
//    Rows & cols = teams in same group
//    Cell = mini score card
//    Right = JRGN / KENA / DFST / MATA / KEDUDUKAN
// ════════════════════════════════════════
function renderMatrix(){
  const grouped={};
  teamList.forEach(t=>{ if(t.group_label)(grouped[t.group_label]||=[]).push(t); });
  const labels=Object.keys(grouped).sort();
  if(!labels.length){ $("#v-matrix").innerHTML=`<div class="empty">Pasukan belum ditetapkan kumpulan.</div>`; return; }

  const groupMatches=matches.filter(m=>m.round==='group');

  // Dedupe: ONE match per unordered pair (avoids duplicate-generate inflation).
  // Whatever match shows in the cell is exactly what counts in JRGN/KENA/MATA.
  const pairKey=(x,y)=>[Math.min(x,y),Math.max(x,y)].join("-");
  const pairMatch=new Map();
  groupMatches.forEach(m=>{
    if(!m.team_a_id||!m.team_b_id) return;
    const k=pairKey(m.team_a_id,m.team_b_id);
    const cur=pairMatch.get(k);
    // prefer a completed match; otherwise keep the latest id
    if(!cur || (m.done && !cur.done) || (m.done===cur.done && m.id>cur.id)) pairMatch.set(k,m);
  });
  const getMatch=(x,y)=>pairMatch.get(pairKey(x,y));

  // stats per team (from deduped matches only)
  const stats={};
  teamList.forEach(t=>{stats[t.id]={gf:0,ga:0,pts:0,w:0,d:0,l:0}});
  pairMatch.forEach(m=>{
    if(!m.done) return;
    const {team_a_id:a,team_b_id:b,score_a:sa,score_b:sb_}=m;
    if(!stats[a]||!stats[b]) return;
    // Only count matches between teams CURRENTLY in the same group.
    // Ignores stale matches left over after teams were moved between groups.
    const ga=teams[a]?.group_label, gb=teams[b]?.group_label;
    if(!ga || ga!==gb) return;
    stats[a].gf+=sa; stats[a].ga+=sb_;
    stats[b].gf+=sb_; stats[b].ga+=sa;
    if(sa>sb_){stats[a].pts+=3;stats[a].w++;stats[b].l++;}
    else if(sa===sb_){stats[a].pts+=1;stats[a].d++;stats[b].pts+=1;stats[b].d++;}
    else{stats[b].pts+=3;stats[b].w++;stats[a].l++;}
  });

  // Ranking (peraturan MSSPP): MATA → DFST → JRGN → head-to-head
  const cmp=(a,b)=>{
    const sa=stats[a.id], sb=stats[b.id];
    if(sb.pts!==sa.pts) return sb.pts-sa.pts;                 // mata
    const gda=sa.gf-sa.ga, gdb=sb.gf-sb.ga;
    if(gdb!==gda) return gdb-gda;                             // 5.2.1 DFST
    if(sb.gf!==sa.gf) return sb.gf-sa.gf;                     // 5.2.2 JRGN
    const h=getMatch(a.id,b.id);                              // 5.2.3 head-to-head
    if(h&&h.done){
      const aSc=h.team_a_id===a.id?h.score_a:h.score_b;
      const bSc=h.team_a_id===a.id?h.score_b:h.score_a;
      if(aSc>bSc) return -1; if(bSc>aSc) return 1;
    }
    return 0;                                                 // 5.2.4 lambung syiling — manual
  };

  let html="";
  for(const g of labels){
    const gt=grouped[g];
    const sorted=[...gt].sort(cmp);

    const cols=sorted.map(t=>`<th class="team-hdr">${t.name}</th>`).join("");
    const rows=sorted.map((row,ri)=>{
      const s=stats[row.id]||{gf:0,ga:0,pts:0};
      const cells=sorted.map(col=>{
        if(row.id===col.id) return `<td class="self"></td>`;
        const m=getMatch(row.id,col.id);
        if(!m||!m.done) return `<td></td>`;
        // from row's perspective
        const myScore=m.team_a_id===row.id?m.score_a:m.score_b;
        const opScore=m.team_a_id===row.id?m.score_b:m.score_a;
        const won=myScore>opScore, draw=myScore===opScore;
        const pts=won?3:draw?1:0;
        return `<td class="cell-match ${won?'won':''}">
          <div class="cell-sc"><span>${myScore}</span><span class="div">|</span><span>${opScore}</span></div>
          <div class="cell-pt">(${pts})</div>
        </td>`;
      }).join("");
      return `<tr class="rank-row">
        <td class="row-lbl">${ri+1}. ${row.name}</td>
        ${cells}
        <td class="stat">${s.gf}</td>
        <td class="stat">${s.ga}</td>
        <td class="stat">${s.gf-s.ga>0?'+':''}${s.gf-s.ga}</td>
        <td class="stat pts">${s.pts}</td>
        <td class="stat">${ri+1}</td>
      </tr>`;
    }).join("");

    html+=`<div class="matrix-wrap">
      <div class="rr-title">Kumpulan ${g}</div>
      <table class="matrix">
        <thead><tr>
          <th class="corner"></th>${cols}
          <th>JRGN</th><th>KENA</th><th>DFST</th><th>MATA</th><th>KEDUDUKAN</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }
  $("#v-matrix").innerHTML=html;
}

// ════════════════════════════════════════
// 4. BRACKET — connector lines
// ════════════════════════════════════════
function renderBracket(){
  const ko=r=>matches.filter(m=>m.round===r).sort((a,b)=>(a.bracket_pos||0)-(b.bracket_pos||0)||a.id-b.id);
  const qf=ko('qf'),sf=ko('sf'),th=ko('third'),fi=ko('final');
  if(!qf.length&&!sf.length&&!fi.length){
    $("#v-bracket").innerHTML=`<div class="empty">Bracket belum dibuka.</div>`; return;
  }
  const champ=fi[0]?.done?(fi[0].score_a>fi[0].score_b?nm(fi[0].team_a_id):nm(fi[0].team_b_id)):null;

  const bCol=(title,list)=>list.length?`<div class="bcol"><h4>${title}</h4>${list.map(m=>bmCard(m)).join("")}</div>`:"";

  // connector join column between two rounds
  const joinCol=(leftCount)=>{
    // pair every 2 left matches → 1 right match
    const pairs=Math.ceil(leftCount/2);
    const segs=Array.from({length:pairs},(_,i)=>
      `<div style="flex:1;display:flex;flex-direction:column">
        <div class="lk top" style="flex:1;position:relative;border-right:2px solid var(--line)">
          <div style="position:absolute;right:0;bottom:0;width:24px;height:2px;background:var(--line)"></div>
        </div>
        <div class="lk bot" style="flex:1;position:relative;border-right:2px solid var(--line)">
          <div style="position:absolute;right:0;top:0;width:24px;height:2px;background:var(--line)"></div>
        </div>
      </div>`).join("");
    return `<div style="width:24px;display:flex;flex-direction:column;gap:16px;padding-top:26px">${segs}</div>`;
  };

  $("#v-bracket").innerHTML=`<div class="bracket">
    ${bCol("Suku Akhir",qf)}
    ${qf.length?joinCol(qf.length):""}
    ${bCol("Separuh Akhir",sf)}
    ${sf.length?joinCol(sf.length):""}
    <div class="bcol">
      <h4>Akhir</h4>
      ${fi.map(m=>bmCard(m,true)).join("")}
      ${champ?`<div class="champ">🏆 Johan: ${champ}</div>`:""}
      ${th.length?`<h4 style="margin-top:16px">Tempat Ke-3</h4>${th.map(m=>bmCard(m)).join("")}`:""}
    </div>
  </div>`;
}
function bmCard(m,isFinal=false){
  const aW=m.done&&m.score_a>m.score_b, bW=m.done&&m.score_b>m.score_a;
  const row=(id,s,w)=>`<div class="bt ${w?'w':''}">
    <span class="n ${id?'':'tbd'}">${nm(id)||'Menunggu…'}</span>
    <span class="s">${m.done?s:''}</span></div>`;
  return `<div class="bm ${isFinal?'final-match':''}">${row(m.team_a_id,m.score_a,aW)}${row(m.team_b_id,m.score_b,bW)}</div>`;
}

boot();

// ── 5-tap logo → admin (easter egg) ──
(function(){
  let taps=0, timer=null;
  const logo=document.getElementById("logo");
  if(!logo) return;
  logo.addEventListener("click",()=>{
    taps++;
    clearTimeout(timer);
    timer=setTimeout(()=>{taps=0},1200);   // reset kalau lambat sangat
    if(taps>=5){ taps=0; window.location.href="admin.html"; }
  });
